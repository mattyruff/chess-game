name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show installed toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test chess rules and computer opponent
        run: swift test
      - name: Build macOS app
        run: >-
          xcodebuild -project RoyalChess.xcodeproj -scheme RoyalChess
          -configuration Debug -destination 'generic/platform=macOS'
          -derivedDataPath build/macOS CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS simulator app
        run: >-
          xcodebuild -project RoyalChess.xcodeproj -scheme RoyalChess
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/iOS CODE_SIGNING_ALLOWED=NO build
